version: 2

updates:
  # Workflow actions are pinned to commit SHAs with a trailing "# vX" comment; Dependabot
  # bumps the SHA and rewrites the comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Python dependencies (pyproject.toml + uv.lock).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # docker-compose is intentionally not covered: the LiteLLM image is hosted on
  # docker.litellm.ai, which Dependabot cannot read (a `docker-registry` entry requires
  # credentials, and an anonymous one is rejected as invalid). The image is pinned by digest
  # in docker-compose.yml; bump it by hand and keep tests/test_repo_config.py green.
