version: 2
updates:
  # Workflow actions are pinned to commit SHAs with a trailing "# vX" comment; Dependabot
  # bumps the SHA and rewrites the comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Python dependencies (pyproject.toml + uv.lock).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # LiteLLM image in docker-compose.yml (tag pinned by digest).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
