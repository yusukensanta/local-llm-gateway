version: 2

registries:
  # docker.litellm.ai fronts ghcr.io and allows anonymous pulls (anonymous token flow).
  # Declaring it lets Dependabot reach the host; no credentials are configured.
  litellm:
    type: docker-registry
    url: https://docker.litellm.ai

updates:
  # Workflow actions are pinned to commit SHAs with a trailing "# vX" comment; Dependabot
  # bumps the SHA and rewrites the comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Python dependencies (pyproject.toml + uv.lock).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # LiteLLM image in docker-compose.yml (tag pinned by digest).
  - package-ecosystem: docker-compose
    directory: /
    registries:
      - litellm
    schedule:
      interval: weekly
