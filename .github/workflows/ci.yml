name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python 3.14 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Verify interpreter
        run: python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version"
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy src
      - name: Pytest
        run: python -m pytest -q

  scripts:
    name: Script validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/setup.sh
          bash -n scripts/install-models.sh
          bash -n scripts/start.sh
          bash -n scripts/register-mcp.sh
      - name: PowerShell syntax and Pester
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem ./scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
          Install-Module Pester -Force -Scope CurrentUser
          Invoke-Pester ./tests/powershell -CI

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate optional LiteLLM profile
        run: |
          cp .env.example .env
          sed -i 's/^LITELLM_MASTER_KEY=.*/LITELLM_MASTER_KEY=sk-ci-validation-only/' .env
          docker compose --profile gateway config --quiet
