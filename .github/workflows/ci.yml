name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.14 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Verify interpreter
        run: uv run --locked python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version"
      - name: Ruff format
        run: uv run --locked ruff format --check .
      - name: Ruff lint
        run: uv run --locked ruff check .
      - name: ty
        run: uv run --locked ty check
      - name: Pytest (coverage gate in pyproject.toml)
        run: uv run --locked pytest --cov

  scripts:
    name: Script validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck scripts/*.sh
      - name: PowerShell syntax and Pester
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser -SkipPublisherCheck
          Invoke-Pester ./tests/powershell -CI

  lockfile:
    name: Lockfile is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv lock --check

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate optional LiteLLM profile
        run: |
          cp .env.example .env
          sed -i 's/^LITELLM_MASTER_KEY=.*/LITELLM_MASTER_KEY=sk-ci-validation-only/' .env
          docker compose --profile gateway config --quiet
