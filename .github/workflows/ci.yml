name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy src
      - run: python -m pytest -q

  scripts:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/setup.sh
          bash -n scripts/install-models.sh
          bash -n scripts/start.sh
          bash -n scripts/register-mcp.sh
      - name: PowerShell syntax and Pester
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem ./scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          Install-Module Pester -Force -Scope CurrentUser
          Invoke-Pester ./tests/powershell -CI

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && sed -i 's/^LITELLM_MASTER_KEY=.*/LITELLM_MASTER_KEY=sk-ci-only/' .env
      - run: docker compose --profile gateway config --quiet
