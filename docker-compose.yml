services:
  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    profiles: ["gateway"]
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./config/litellm.example.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
