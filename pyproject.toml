[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-llm-gateway"
version = "0.1.0"
description = "Read-only MCP tools for local Ollama coding assistance"
readme = "README.md"
requires-python = "==3.14.*"
license = { text = "MIT" }
dependencies = ["httpx>=0.27,<1", "mcp>=1.2,<2", "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3"]

[project.optional-dependencies]
dev = ["mypy>=1.11,<2", "pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1"]

[project.scripts]
local-llm-mcp = "local_llm.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
